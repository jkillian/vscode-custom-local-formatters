name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Type check
        run: yarn compile
      - name: Lint
        run: yarn lint
      - name: Check formatting
        run: yarn format:check
      - name: Test
        run: xvfb-run -a yarn vscode-test
